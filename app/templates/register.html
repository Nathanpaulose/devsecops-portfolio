{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Create an account</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" required pattern="[A-Za-z0-9_]{3,32}" autocomplete="username"></label>
  <label>Password (12+ characters) <input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
